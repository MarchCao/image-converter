<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>录音转文字 · 浏览器端完整实测</title>
<style>
  body { font-family: -apple-system, sans-serif; margin: 16px; line-height: 1.5; }
  button { font-size: 17px; padding: 12px 18px; margin: 6px 6px 6px 0; border-radius: 10px; border: none; background: #1677ff; color: #fff; font-weight: 600; -webkit-appearance: none; appearance: none; }
  button:disabled { opacity: .45; }
  input[type=file] { font-size: 17px; padding: 10px 0; }
  pre { white-space: pre-wrap; word-break: break-all; background: #111; color: #0f0; padding: 12px; border-radius: 8px; font-size: 13px; min-height: 200px; }
  .note { color: #555; font-size: 14px; }
  .card { border: 1px solid #ddd; border-radius: 10px; padding: 12px; margin: 14px 0; }
  #statusBar { position: sticky; top: 0; z-index: 10; background: #fff8d6; border: 1px solid #e3c878; border-radius: 8px; padding: 10px 12px; font-size: 15px; margin-bottom: 10px; }
  input[type=file] { font-size: 16px; }
  select { font-size: 16px; padding: 6px; }
</style>
</head>
<body>
<h2>录音转文字 · 浏览器端完整实测</h2>
<div id="statusBar">状态：页面加载中…</div>
<p class="note">本页会在<b>这台设备本地</b>下载语音模型（约 81MB）并转写样本，全程不上传音频。测完请把下方黑框里的结果截图或复制发回。</p>

<div class="card">
  <b>第一步：内置样本实测</b>
  <p>
    <button id="btnHf">① 官方源实测（huggingface.co）</button>
    <button id="btnMirror">② 镜像源实测（hf-mirror.com）</button>
    <button id="btnLocal">③ 国内镜像通道实测（库+模型全镜像）</button>
  </p>
</div>

<div class="card">
  <b>第二步：测你自己的录音文件</b>
  <p class="note">选一个语音备忘录导出的 .m4a（建议 5 分钟以内），先测解码，再可转写前 60 秒。文件只在本机处理，不上传。</p>
  <p class="note">操作顺序：① 点下面「选择文件」选录音 → ② 等黑框出现「文件解码 OK」→ ③ 点蓝色按钮转写。</p>
  <p><input type="file" id="fileInput" accept="audio/*,.m4a,.mp3,.wav"></p>
  <p>
    通道：
    <select id="hostSel">
      <option value="A">A 官方（海外CDN+官方模型）</option>
      <option value="B">B 镜像模型</option>
      <option value="C">C 国内镜像（库+模型全镜像）</option>
    </select>
    <button id="btnFile">转写所选文件（前 60 秒）</button>
  </p>
</div>

<pre id="out">准备就绪…</pre>

<script>
const outEl = document.getElementById('out');
const lines = [];
function log(s) {
  const t = new Date();
  const ts = String(t.getMinutes()).padStart(2, '0') + ':' + String(t.getSeconds()).padStart(2, '0');
  lines.push('[' + ts + '] ' + s);
  outEl.textContent = lines.join('\n');
  const bar = document.getElementById('statusBar');
  if (bar) bar.textContent = '状态：' + s;
}
window.addEventListener('error', (e) => { try { log('页面脚本错误: ' + (e.message || e.type)); } catch (_) {} });
window.addEventListener('unhandledrejection', (e) => { try { log('未处理异常: ' + String((e.reason && e.reason.message) || e.reason)); } catch (_) {} });
window.__log = log;
log('UA: ' + navigator.userAgent);
log('crossOriginIsolated: ' + window.crossOriginIsolated);
log('WebGPU(navigator.gpu): ' + (!!navigator.gpu));
log('硬件并发: ' + (navigator.hardwareConcurrency || '未知') + ' / 设备内存(GB,仅供参考): ' + (navigator.deviceMemory || '未知'));
</script>

<script type="module">
const log = window.__log;

// ---- 内置样本解码检查 + 连通性探针(异步初始化,兼容旧浏览器:不用顶层 await) ----
const PROBES = [
  ['运行库 jsdelivr', 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.1/package.json'],
  ['运行库 esm.run', 'https://esm.run/@huggingface/transformers@4.3.1'],
  ['模型官方 huggingface.co', 'https://huggingface.co/onnx-community/whisper-base/resolve/main/config.json'],
  ['模型镜像 hf-mirror.com', 'https://hf-mirror.com/onnx-community/whisper-base/resolve/main/config.json'],
  ['npmmirror', 'https://registry.npmmirror.com/@huggingface/transformers/4.3.1/files/package.json'],
];
async function init() {
  const files = ['zh.wav', 'zh.mp3', 'zh-synthetic.m4a'];
  for (const f of files) {
    try {
      const resp = await fetch('audio/' + f);
      const buf = await resp.arrayBuffer();
      const ctx = new OfflineAudioContext(1, 1, 16000);
      const audio = await ctx.decodeAudioData(buf);
      log('DECODE OK  ' + f + ': 时长=' + audio.duration.toFixed(2) + 's');
    } catch (e) { log('DECODE FAIL ' + f + ': ' + e.name + ' ' + e.message); }
  }
  log('解码检查完成。第一步:点 ① 做模型实测(首次约 81MB,请保持页面在前台)。');
  log('开始连通性探针…');
  await Promise.all(PROBES.map(async ([name, url]) => {
    const t = performance.now();
    const ctl = new AbortController();
    const to = setTimeout(() => ctl.abort(), 12000);
    try {
      const r = await fetch(url, { signal: ctl.signal, cache: 'no-store' });
      if (r.body) { const rd = r.body.getReader(); await rd.read(); rd.cancel().catch(() => {}); }
      clearTimeout(to);
      log('探针 ' + name + ': ' + (r.ok ? '可达' : 'HTTP ' + r.status) + ' ' + Math.round(performance.now() - t) + 'ms');
    } catch (e) {
      clearTimeout(to);
      log('探针 ' + name + ': 不可达 (' + (e.name === 'AbortError' ? '超时12s' : e.message) + ')');
    }
  }));
  log('探针完成。若某个源不可达,就避开用它的通道。');
  log('就绪。');
}
init().catch((e) => log('初始化异常: ' + String((e && e.message) || e)));

// ---- 通道定义:A 海外CDN+官方模型 / B 海外CDN+镜像模型 / C 国内镜像(库+模型) ----
const CHANNELS = {
  A: { lib: 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.1/+esm', host: 'https://huggingface.co', wasm: null, name: 'A官方' },
  B: { lib: 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.1/+esm', host: 'https://hf-mirror.com', wasm: null, name: 'B镜像模型' },
  C: { lib: 'https://esm.run/@huggingface/transformers@4.3.1', host: 'https://hf-mirror.com', wasm: null, name: 'C国内镜像' },
};

function makeWorkerSrc(ch) {
  return `
if (typeof globalThis.structuredClone !== 'function') {
  globalThis.structuredClone = function (value) {
    if (value === null || typeof value !== 'object') return value;
    if (value instanceof Date) return new Date(value.getTime());
    if (value instanceof RegExp) return new RegExp(value);
    if (value instanceof ArrayBuffer) return value.slice(0);
    if (ArrayBuffer.isView(value)) {
      if (value instanceof DataView) return new DataView(value.buffer.slice(value.byteOffset, value.byteOffset + value.byteLength));
      return new value.constructor(value);
    }
    if (value instanceof Map) return new Map(Array.from(value, function (e) { return [globalThis.structuredClone(e[0]), globalThis.structuredClone(e[1])]; }));
    if (value instanceof Set) return new Set(Array.from(value, function (v) { return globalThis.structuredClone(v); }));
    if (Array.isArray(value)) return value.map(function (v) { return globalThis.structuredClone(v); });
    const out = {};
    for (const k of Object.keys(value)) out[k] = globalThis.structuredClone(value[k]);
    return out;
  };
}
let pipeline, env, asr = null;
const ready = (async () => {
  const mod = await import('${ch.lib}');
  pipeline = mod.pipeline; env = mod.env;
  env.allowLocalModels = false;
  ${ch.wasm ? `env.backends.onnx.wasm.wasmPaths = '${ch.wasm}';` : ''}
})();
ready.catch((e) => { self.postMessage({ type: 'error', message: '运行库加载失败: ' + String((e && e.message) || e) }); });
self.onmessage = async (e) => {
  const { audio, host } = e.data;
  try {
    await ready;
    env.remoteHost = host;
    if (!asr) {
      asr = await pipeline('automatic-speech-recognition', 'onnx-community/whisper-base', {
        dtype: 'q8', device: 'wasm',
        progress_callback: (p) => {
          if (p.status === 'progress' && p.file) self.postMessage({ type: 'dl', file: p.file, pct: Math.round(p.progress || 0) });
          else if (p.status === 'ready') self.postMessage({ type: 'ready' });
        }
      });
    }
    const t = performance.now();
    const out = await asr(audio, { language: 'chinese', task: 'transcribe' });
    self.postMessage({ type: 'done', text: out.text, secs: (performance.now() - t) / 1000 });
  } catch (err) {
    self.postMessage({ type: 'error', message: String((err && err.message) || err) });
  }
};
`;
}

async function driveWorker(worker, pcm, host, label) {
  const lastPct = {};
  try {
    await new Promise((resolve, reject) => {
      const timer = setTimeout(() => { clearInterval(watchdog); reject(new Error('超时 8 分钟')); }, 8 * 60 * 1000);
      let lastMsg = Date.now();
      let lastWarn = 0;
      let gotReady = false;
      const watchdog = setInterval(() => {
        const silentMs = Date.now() - lastMsg;
        if (!gotReady && silentMs > 150000) {
          cleanup();
          reject(new Error('模型下载阶段 150 秒无任何进度,判定当前通道的模型源不可达,请换通道重试'));
        } else if (silentMs > 25000 && Date.now() - lastWarn > 30000) {
          lastWarn = Date.now();
          log('仍在等待运行库/模型响应(已 ' + Math.round(silentMs / 1000) + ' 秒无新进度)。若长时间无下载进度,多半是当前网络连不上这个源,请换另一个源按钮重试,并把本行截图发回。');
        }
      }, 10000);
      const cleanup = () => { clearTimeout(timer); clearInterval(watchdog); };
      worker.onmessage = (e) => {
        lastMsg = Date.now();
        const m = e.data;
        if (m.type === 'dl') {
          if (m.pct !== lastPct[m.file] && (m.pct % 25 === 0 || m.pct === 100)) { lastPct[m.file] = m.pct; log('下载 ' + m.file.split('/').pop() + ': ' + m.pct + '%'); }
        } else if (m.type === 'ready') { gotReady = true; log('模型就绪,开始转写…'); }
        else if (m.type === 'done') { cleanup(); log(label + ' 转写完成,用时 ' + m.secs.toFixed(1) + 's'); log('结果: ' + m.text.trim()); resolve(); }
        else if (m.type === 'error') { cleanup(); reject(new Error(m.message)); }
      };
      worker.onerror = (e) => { cleanup(); reject(new Error('Worker错误: ' + (e.message || '未知'))); };
      worker.postMessage({ audio: pcm, host }, [pcm.buffer.slice(0)]);
    });
  } finally { worker.terminate(); }
}

function setBtns(disabled) {
  ['btnHf', 'btnMirror', 'btnLocal', 'btnFile'].forEach(id => { const b = document.getElementById(id); if (b) b.disabled = disabled; });
}

async function transcribe(pcm, chKey, label) {
  const ch = CHANNELS[chKey];
  const blob = new Blob([makeWorkerSrc(ch)], { type: 'text/javascript' });
  const worker = new Worker(URL.createObjectURL(blob), { type: 'module' });
  await driveWorker(worker, pcm, ch.host, label);
}

async function getSamplePCM() {
  const resp = await fetch('audio/zh.mp3');
  const buf = await resp.arrayBuffer();
  const ctx = new OfflineAudioContext(1, 1, 16000);
  const audio = await ctx.decodeAudioData(buf);
  return audio.getChannelData(0);
}

async function runSampleTest(label, chKey) {
  setBtns(true);
  log('==== ' + label + ' 开始 (通道=' + CHANNELS[chKey].name + ') ====');
  try {
    const pcm = await getSamplePCM();
    log('样本已解码: ' + (pcm.length / 16000).toFixed(1) + 's PCM');
    await transcribe(pcm, chKey, '内置样本');
    log('==== ' + label + ' 成功 ====');
  } catch (err) { log('==== ' + label + ' 失败: ' + err.message + ' ====' ); }
  setBtns(false);
}

document.getElementById('btnHf').onclick = () => runSampleTest('官方源实测', 'A');
document.getElementById('btnMirror').onclick = () => runSampleTest('镜像源实测', 'B');
document.getElementById('btnLocal').onclick = () => runSampleTest('国内镜像通道实测', 'C');

// ---- 用户自选文件:解码 + 转写 ----
const fileInput = document.getElementById('fileInput');
fileInput.addEventListener('change', async () => {
  const file = fileInput.files && fileInput.files[0];
  window.__filePcm = null;
  if (!file) return;
  log('---- 已选文件: ' + file.name + ' 大小=' + (file.size / 1024).toFixed(0) + 'KB 类型=' + (file.type || '未知'));
  log('正在解码所选文件…');
  try {
    const buf = await file.arrayBuffer();
    const ctx = new OfflineAudioContext(1, 1, 16000);
    const audio = await ctx.decodeAudioData(buf);
    log('文件解码 OK: 时长=' + audio.duration.toFixed(1) + 's 解码采样率=' + audio.sampleRate + ' 声道=' + audio.numberOfChannels);
    window.__filePcm = audio.getChannelData(0);
    log('现在可以点蓝色按钮「转写所选文件」了(超过 60 秒只转前 60 秒)。');
  } catch (e) {
    log('文件解码 FAIL: ' + e.name + ' ' + e.message + ' ← 这一行请务必截图发回');
  }
});

document.getElementById('btnFile').onclick = async () => {
  const pcm = window.__filePcm;
  if (!pcm) { log('提示: 还没有可转写的文件。请先在第二步选一个录音文件,等黑框出现「文件解码 OK」再点这个按钮。'); return; }
  const ch = document.getElementById('hostSel').value;
  const sliced = pcm.length > 16000 * 60 ? pcm.slice(0, 16000 * 60) : pcm;
  setBtns(true);
  log('==== 所选文件转写开始 (' + (sliced.length / 16000).toFixed(1) + 's, 通道=' + ch + ') ====');
  try {
    await transcribe(sliced, ch, '所选文件');
    log('==== 所选文件转写 成功 ====');
  }
  catch (err) { log('==== 所选文件转写 失败: ' + err.message + ' ===='); }
  setBtns(false);
};
</script>
</body>
</html>
